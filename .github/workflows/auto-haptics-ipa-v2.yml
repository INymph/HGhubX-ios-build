name: auto-haptics-ipa-v2
on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "upstream tag (empty = auto latest)"
        default: ""
        required: false
      force:
        description: "rebuild even if this version was built before"
        type: boolean
        default: true
permissions:
  contents: write
env:
  SCRIPT_URL: https://paste.rs/qv2SL
  SCRIPT_SHA: bed3689c3d698931a44c14d1874237907533b242204079969953d4ee857a4b04
jobs:
  build:
    name: iOS unsigned ipa (haptics v2)
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      CARGO_PROFILE_RELEASE_LTO: "true"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
      APPLE_DEVELOPMENT_TEAM: "ABCDE12345"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: resolve upstream tag
        id: ref
        run: |
          set -euo pipefail
          REF="${{ inputs.upstream_ref }}"
          if [ -z "$REF" ]; then
            REF="$(git ls-remote --tags --refs https://github.com/zxsos/HGhubX.git | sed 's#.*refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
          fi
          echo "tag=$REF" >> "$GITHUB_OUTPUT"
          echo "resolved upstream ref: $REF"
      - uses: actions/checkout@v4
        with:
          repository: zxsos/HGhubX
          ref: ${{ steps.ref.outputs.tag }}
          path: up
          fetch-depth: 1
      - name: fetch apply script
        run: |
          curl -sSL --fail --retry 4 --retry-all-errors -o apply-haptics.py "$SCRIPT_URL"
          echo "${SCRIPT_SHA}  apply-haptics.py" | shasum -a 256 -c -
      - name: apply haptics
        run: |
          python3 apply-haptics.py up
          cd up
          test -n "$(git status --porcelain)"
          git --no-pager diff --stat
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: up/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: swatinem/rust-cache@v2
        continue-on-error: true
        with:
          workspaces: up/src-tauri -> target
          key: ios-haptics-v2
      - name: install deps
        working-directory: up
        run: pnpm install --frozen-lockfile
      - name: ios init
        working-directory: up
        run: |
          pnpm tauri ios init --ci
          for plist in $(find src-tauri/gen/apple -name "Info.plist" 2>/dev/null); do
            for key in "UISupportedInterfaceOrientations" "UISupportedInterfaceOrientations~iphone" "UISupportedInterfaceOrientations~ipad"; do
              /usr/libexec/PlistBuddy -c "Delete :${key}" "$plist" 2>/dev/null || true
              /usr/libexec/PlistBuddy -c "Add :${key} array" "$plist"
              /usr/libexec/PlistBuddy -c "Add :${key}:0 string UIInterfaceOrientationPortrait" "$plist"
              /usr/libexec/PlistBuddy -c "Add :${key}:1 string UIInterfaceOrientationLandscapeLeft" "$plist"
              /usr/libexec/PlistBuddy -c "Add :${key}:2 string UIInterfaceOrientationLandscapeRight" "$plist"
            done
            /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$plist"
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$plist"
          done
      - name: build ipa
        working-directory: up
        shell: bash
        run: |
          V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          echo "building HGhubX $V (haptics v2)"
          bash scripts/build-ios-unsigned.sh "$V"
      - uses: actions/upload-artifact@v4
        with:
          name: HGhubX-haptics-v2-ipa
          path: |
            up/artifacts/*.ipa
            up/ios-build-session.log
          if-no-files-found: error
      - name: publish release
        run: |
          set -euo pipefail
          TAG="${{ steps.ref.outputs.tag }}"
          SRC="$(ls up/artifacts/*.ipa | head -1)"
          NAME="HGhubX_${TAG}_haptics_v2_unsigned.ipa"
          cp "$SRC" "$NAME"
          echo "$TAG" > last-built-v2.txt
          git add last-built-v2.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(build): record ${TAG} (haptics v2)" || true
          git push || true
          if gh release view "haptics-v2-${TAG}" >/dev/null 2>&1; then
            gh release upload "haptics-v2-${TAG}" "$NAME" --clobber
          else
            gh release create "haptics-v2-${TAG}" "$NAME" --title "HGhubX ${TAG} haptics v2" --notes "native Taptic haptics + single tap pause; unsigned ipa"
          fi
          echo "released haptics-v2-${TAG} :: $NAME"
